[meta]
name = "fog-of-war"
version = "0.1.0"
description = "Vision and visibility control — fog of war, player view, and spectator modes for Swarm"
author = "Swarm Team"

[dependencies]

[config]
fog_of_war = { type = "bool", default = true, description = "Enable fog of war vision filtering" }
player_view = { type = "enum", values = ["drone", "full", "allied"], default = "drone", description = "Engine-owned player visibility mode" }

[compatibility]
engine_abi_min = "1.0"
